name: CI and Docker delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image
        run: docker buildx build --load --target test --tag todo-app:test .
      - name: Run tests in the test image
        run: docker run --rm todo-app:test
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: zeeshanwasim/todo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            zeeshanwasim/todo-app:latest
            zeeshanwasim/todo-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != '' && vars.DEPLOY_FINGERPRINT != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to configured Docker host
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          IMAGE: zeeshanwasim/todo-app:sha-${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          fingerprint: ${{ vars.DEPLOY_FINGERPRINT }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN,IMAGE
          script: |
            set -eu
            printf '%s' "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker volume create todo-data >/dev/null
            docker rm -f todo-container-candidate >/dev/null 2>&1 || true
            docker run -d --name todo-container-candidate -p 127.0.0.1:15000:5000 -v todo-data:/data -e TODO_DB_PATH=/data/tasks.db "$IMAGE"
            ready=0
            for attempt in $(seq 1 30); do
              if docker exec todo-container-candidate python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2)"; then ready=1; break; fi
              sleep 2
            done
            docker rm -f todo-container-candidate >/dev/null
            if [ "$ready" -ne 1 ]; then echo 'Candidate failed health check'; exit 1; fi
            docker rm -f todo-container-previous >/dev/null 2>&1 || true
            if docker inspect todo-container >/dev/null 2>&1; then docker stop todo-container >/dev/null; docker rename todo-container todo-container-previous; fi
            if docker run -d --name todo-container -p 5000:5000 -v todo-data:/data -e TODO_DB_PATH=/data/tasks.db "$IMAGE"; then
              ready=0
              for attempt in $(seq 1 30); do
                if docker inspect --format '{{.State.Health.Status}}' todo-container | grep -qx healthy; then ready=1; break; fi
                sleep 2
              done
              if [ "$ready" -eq 1 ]; then docker rm -f todo-container-previous >/dev/null 2>&1 || true; exit 0; fi
            fi
            docker rm -f todo-container >/dev/null 2>&1 || true
            if docker inspect todo-container-previous >/dev/null 2>&1; then docker rename todo-container-previous todo-container; docker start todo-container >/dev/null; fi
            exit 1
